<g transform="translate(700 427)"><rect width="414" height="199" rx="18" fill="#355475"/><text x="26" y="43" font-family="Arial,sans-serif" font-size="14" fill="#d2deec">02 / SEMANTIC ALIAS</text><text x="26" y="91" font-size="24" fill="#fff">一处维护，统一引用。</text><text x="26" y="135" font-family="Consolas,monospace" font-size="19" fill="#e3edfa">blue/600 →</text><text x="26" y="171" font-family="Consolas,monospace" font-size="18" fill="#fff">color/action/primary</text></g>
<g transform="translate(700 646)"><rect width="414" height="157" rx="18" fill="#f7f9fb" stroke="#cdd7e3" stroke-width="2"/><text x="26" y="40" font-family="Arial,sans-serif" font-size="14" fill="#5e6e82">03 / COMPONENT PREVIEW</text><rect x="26" y="66" width="129" height="50" rx="6" fill="#165dff"/><text x="50" y="98" font-size="18" fill="#fff">主要操作</text><rect x="168" y="66" width="220" height="50" rx="6" fill="#f2f3f5" stroke="#e5e6eb"/><text x="187" y="98" font-size="16" fill="#86909c">输入内容…</text></g>
