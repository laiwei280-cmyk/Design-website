<text x="28" y="43" font-family="Arial,sans-serif" font-size="14" fill="#5e6e82">01 / COLOR FOUNDATIONS</text><text x="28" y="100" font-size="33" font-weight="700" fill="#253449">让每一种颜色，都有明确的角色。</text>
<g transform="translate(28 135)"><rect width="61" height="112" rx="7" fill="#165dff"/><rect x="69" width="61" height="112" rx="7" fill="#00b42a"/><rect x="138" width="61" height="112" rx="7" fill="#e49019"/><rect x="207" width="61" height="112" rx="7" fill="#f53f3f"/><rect x="276" width="61" height="112" rx="7" fill="#1d2129"/><rect x="345" width="61" height="112" rx="7" fill="#86909c"/><rect x="414" width="61" height="112" rx="7" fill="#e5e6eb"/><rect x="483" width="61" height="112" rx="7" fill="#f8f9fc" stroke="#e5e6eb"/></g>
