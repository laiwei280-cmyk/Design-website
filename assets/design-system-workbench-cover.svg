<svg xmlns="http://www.w3.org/2000/svg" width="1701" height="925" viewBox="0 0 1701 925">
<rect width="1701" height="925" fill="#ecf0f4"/>
<g font-family="Microsoft YaHei,PingFang SC,sans-serif">
<text x="80" y="102" font-size="21" letter-spacing="3" fill="#1b64db">PROJECT 03 / DESIGN SYSTEM</text>
<text x="80" y="224" font-size="82" font-weight="700" fill="#253449">B 端设计规范</text>
<text x="83" y="292" font-size="67" font-family="Arial,sans-serif" font-weight="700" fill="none" stroke="#8798ac" stroke-width="1.4">Design System.</text>
<text x="83" y="346" font-size="25" fill="#5e6e82">从设计变量，到业务组件。</text>
<g font-size="24" fill="#5e6e82"><text x="1020" y="215">把颜色、层级与状态整理为</text><text x="1020" y="258">可复用的设计语言。</text></g>
<path d="M80 393h1541" stroke="#cdd6e0"/>
